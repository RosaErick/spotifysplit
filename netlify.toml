[build]
  # O campo "Base directory" na UI da Netlify precisa ficar VAZIO. Se apontar
  # para `client`, todos os caminhos abaixo passam a resolver a partir dali
  # (`client/client/dist`) e o diretorio de functions some.
  #
  # A instalacao de dependencias roda na raiz, mas o build e do `client/`, que
  # tem package.json proprio. Por isso o install explicito com --prefix: sem
  # ele o build quebra com "vite: not found".
  command = "npm install --prefix client && npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20.19.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Fallback de SPA: as rotas do React Router (/top-tracks, /sobre, ...) precisam
# cair no index.html em vez de 404.
#
# Os endpoints em /api/* nao sao afetados: cada function declara o proprio
# `config.path`, resolvido antes desta regra de redirect.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
