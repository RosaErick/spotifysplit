[build]
  # Fixa a raiz do repo como base, sobrepondo o que estiver na UI. A deteccao
  # automatica da Netlify sugere `client` (e onde esta o app Vite), mas as
  # functions ficam na raiz: com base em `client` o publish vira
  # `client/client/dist` e o diretorio de functions deixa de existir.
  #
  # Todos os caminhos deste arquivo sao relativos a este base.
  base = "/"

  # A instalacao de dependencias roda na base, mas o app fica em `client/`, com
  # package.json proprio. Sem o install explicito o build quebra com
  # "vite: not found".
  command = "npm install --prefix client && npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20.19.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Fallback de SPA: as rotas do React Router (/top-tracks, /sobre, ...) precisam
# cair no index.html em vez de 404.
#
# Os endpoints em /api/* nao sao afetados: cada function declara o proprio
# `config.path`, resolvido antes desta regra de redirect.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
